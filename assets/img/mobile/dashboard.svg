<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img" aria-labelledby="mob-dash-title">
  <title id="mob-dash-title">DashyNMS Mobile dashboard: 3 critical and 7 warning alerts, 142 devices up and 3 down, three items needing attention, and two pinned devices</title>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  </style>

  <rect width="390" height="844" fill="#11141a"/>

  <!-- header -->
  <g>
    <circle cx="33" cy="46" r="16" fill="#171b23"/>
    <circle cx="33" cy="46" r="14.75" fill="none" stroke="#3b82f6" stroke-width="2.6"/>
    <polyline points="24.6,49.2 29.5,49.2 32.1,41.7 36,53.8 38.9,46 44,46" fill="none" stroke="#e8eef6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="52" font-size="22" font-weight="700" fill="#e8eef6">DashyNMS</text>
    <rect x="330" y="24" width="44" height="44" rx="12" fill="#1e2430"/>
    <g stroke="#a3adbb" stroke-width="1.8" stroke-linecap="round">
      <line x1="341" y1="41" x2="351" y2="41"/>
      <line x1="355" y1="41" x2="363" y2="41"/>
      <circle cx="353" cy="41" r="2.6" fill="#a3adbb"/>
      <line x1="341" y1="51" x2="349" y2="51"/>
      <line x1="353" y1="51" x2="363" y2="51"/>
      <circle cx="351" cy="51" r="2.6" fill="#a3adbb"/>
    </g>
  </g>

  <!-- Alerts card -->
  <g>
    <rect x="16" y="84" width="358" height="168" rx="16" fill="#171b23" stroke="#232a36"/>
    <text x="30" y="110" font-size="15" font-weight="600" fill="#e8eef6">Alerts</text>
    <text x="360" y="109" font-size="12" fill="#7f8a9a" text-anchor="end">Checked 30s ago</text>

    <rect x="30" y="126" width="161" height="52" rx="12" fill="#1e2430"/>
    <text x="42" y="158" font-size="24" font-weight="700" fill="#ff7b72">3</text>
    <text x="72" y="157" font-size="14" fill="#a3adbb">Critical</text>

    <rect x="199" y="126" width="161" height="52" rx="12" fill="#1e2430"/>
    <text x="211" y="158" font-size="24" font-weight="700" fill="#f2c14e">7</text>
    <text x="241" y="157" font-size="14" fill="#a3adbb">Warning</text>

    <rect x="30" y="186" width="161" height="52" rx="12" fill="#1e2430"/>
    <text x="42" y="218" font-size="24" font-weight="700" fill="#56d364">12</text>
    <text x="72" y="217" font-size="14" fill="#a3adbb">OK</text>

    <rect x="199" y="186" width="161" height="52" rx="12" fill="#1e2430"/>
    <text x="211" y="218" font-size="24" font-weight="700" fill="#c9d1dc">2</text>
    <text x="241" y="217" font-size="14" fill="#a3adbb">Acknowledged</text>
  </g>

  <!-- Devices card -->
  <g>
    <rect x="16" y="264" width="358" height="168" rx="16" fill="#171b23" stroke="#232a36"/>
    <text x="30" y="290" font-size="15" font-weight="600" fill="#e8eef6">Devices</text>
    <text x="360" y="289" font-size="12" fill="#7f8a9a" text-anchor="end">150 in total</text>

    <rect x="30" y="306" width="161" height="52" rx="12" fill="#1e2430"/>
    <text x="42" y="338" font-size="24" font-weight="700" fill="#56d364">142</text>
    <text x="82" y="337" font-size="14" fill="#a3adbb">Up</text>

    <rect x="199" y="306" width="161" height="52" rx="12" fill="#1e2430"/>
    <text x="211" y="338" font-size="24" font-weight="700" fill="#ff7b72">3</text>
    <text x="234" y="337" font-size="14" fill="#a3adbb">Down</text>

    <rect x="30" y="366" width="161" height="52" rx="12" fill="#1e2430"/>
    <text x="42" y="398" font-size="24" font-weight="700" fill="#79b8ff">1</text>
    <text x="60" y="397" font-size="14" fill="#a3adbb">Maintenance</text>

    <rect x="199" y="366" width="161" height="52" rx="12" fill="#1e2430"/>
    <text x="211" y="398" font-size="24" font-weight="700" fill="#c9d1dc">4</text>
    <text x="234" y="397" font-size="14" fill="#a3adbb">Disabled</text>
  </g>

  <!-- Needs attention card -->
  <g>
    <rect x="16" y="444" width="358" height="202" rx="16" fill="#171b23" stroke="#232a36"/>
    <text x="30" y="470" font-size="15" font-weight="600" fill="#e8eef6">Needs attention</text>
    <text x="360" y="470" font-size="13" font-weight="500" fill="#60a5fa" text-anchor="end">See all</text>

    <line x1="30" y1="538" x2="360" y2="538" stroke="#232a36"/>
    <line x1="30" y1="590" x2="360" y2="590" stroke="#232a36"/>

    <circle cx="35" cy="512" r="5" fill="#da3633"/>
    <text x="52" y="508" font-size="15" font-weight="600" fill="#e8eef6">edge-rtr-02</text>
    <text x="52" y="524" font-size="13" fill="#a3adbb">Device down</text>
    <text x="360" y="512" font-size="12" fill="#7f8a9a" text-anchor="end">4m</text>

    <circle cx="35" cy="564" r="5" fill="#da3633"/>
    <text x="52" y="560" font-size="15" font-weight="600" fill="#e8eef6">ups-dc-a</text>
    <text x="52" y="576" font-size="13" fill="#a3adbb">UPS on battery</text>
    <text x="360" y="564" font-size="12" fill="#7f8a9a" text-anchor="end">12m</text>

    <circle cx="35" cy="616" r="5" fill="#da3633"/>
    <text x="52" y="612" font-size="15" font-weight="600" fill="#e8eef6">fw-01</text>
    <text x="52" y="628" font-size="13" fill="#a3adbb">BGP session down</text>
    <text x="360" y="616" font-size="12" fill="#7f8a9a" text-anchor="end">38m</text>
  </g>

  <!-- Pinned card -->
  <g>
    <rect x="16" y="658" width="358" height="150" rx="16" fill="#171b23" stroke="#232a36"/>
    <text x="30" y="684" font-size="15" font-weight="600" fill="#e8eef6">Pinned</text>

    <line x1="30" y1="750" x2="360" y2="750" stroke="#232a36"/>

    <circle cx="35" cy="722" r="5" fill="#2ea043"/>
    <text x="52" y="718" font-size="15" font-weight="600" fill="#e8eef6">core-sw-01</text>
    <text x="52" y="734" font-size="13" fill="#a3adbb" class="mono">10.20.0.2</text>
    <text x="360" y="722" font-size="12" fill="#7f8a9a" text-anchor="end">Up 41d</text>

    <circle cx="35" cy="774" r="5" fill="#2ea043"/>
    <text x="52" y="770" font-size="15" font-weight="600" fill="#e8eef6">fw-01</text>
    <text x="52" y="786" font-size="13" fill="#a3adbb" class="mono">10.20.0.1</text>
    <text x="360" y="774" font-size="12" fill="#7f8a9a" text-anchor="end">Up 12d</text>
  </g>

  <!-- tab bar -->
  <g>
    <rect x="0" y="760" width="390" height="84" fill="#171b23"/>
    <line x1="0" y1="760" x2="390" y2="760" stroke="#232a36"/>

    <g fill="#60a5fa">
      <rect x="19" y="777" width="7" height="9" rx="1.5" fill="none" stroke="#60a5fa" stroke-width="1.6"/>
      <rect x="30" y="777" width="7" height="5" rx="1.5" fill="none" stroke="#60a5fa" stroke-width="1.6"/>
      <rect x="30" y="786" width="7" height="9" rx="1.5" fill="none" stroke="#60a5fa" stroke-width="1.6"/>
      <rect x="19" y="799" width="7" height="5" rx="1.5" fill="none" stroke="#60a5fa" stroke-width="1.6"/>
      <text x="33" y="820" font-size="11" font-weight="500" fill="#60a5fa" text-anchor="middle">Dashboard</text>
    </g>

    <g stroke="#8b95a5" stroke-width="1.6" fill="none">
      <rect x="99" y="780" width="18" height="7" rx="2"/>
      <rect x="99" y="789" width="18" height="7" rx="2"/>
      <text x="119" y="820" font-size="11" font-weight="500" fill="#8b95a5" text-anchor="middle">Devices</text>
    </g>

    <g stroke="#8b95a5" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M189 793v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/>
      <path d="M193 797.5a2 2 0 0 0 4 0"/>
      <circle cx="209" cy="777" r="9" fill="#da3633" stroke="none"/>
      <text x="209" y="781" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">10</text>
      <text x="195" y="820" font-size="11" font-weight="500" fill="#8b95a5" text-anchor="middle">Alerts</text>
    </g>

    <g stroke="#8b95a5" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M262 792h4l2-5 4 10 2-5h6"/>
      <text x="271" y="820" font-size="11" font-weight="500" fill="#8b95a5" text-anchor="middle">Health</text>
    </g>

    <g stroke="#8b95a5" stroke-width="1.6" fill="none" stroke-linecap="round">
      <line x1="338" y1="781" x2="354" y2="781"/>
      <line x1="338" y1="787" x2="354" y2="787"/>
      <line x1="338" y1="793" x2="354" y2="793"/>
      <text x="347" y="820" font-size="11" font-weight="500" fill="#8b95a5" text-anchor="middle">More</text>
    </g>
  </g>
</svg>
