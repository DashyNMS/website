    <circle cx="150" cy="352" r="4.5" fill="#22c55e"/>
    <text x="180" y="356" font-weight="600" fill="#e8eef6">dc-ups-1</text>
    <text x="380" y="356" fill="#9aa4b6">10.0.9.5</text>
