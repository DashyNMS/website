    <path d="M91.5 292l3 3 6-6.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="150" cy="296" r="4.5" fill="#f59e0b"/>
