  </style>

  <rect x="0.5" y="0.5" width="979" height="619" rx="14" fill="#171b23" stroke="#262c38"/>

  <path d="M0.5 14.5a14 14 0 0 1 14-14h951a14 14 0 0 1 14 14v29.5H0.5V14.5z" fill="#171b23" stroke="#262c38"/>
  <rect x="20" y="14" width="16" height="16" rx="4" fill="#3b82f6"/>
  <text x="44" y="27" font-size="13" font-weight="600" fill="#9aa4b6">DashyNMS</text>
  <g stroke="#5b6472" stroke-width="1.4" stroke-linecap="round">
