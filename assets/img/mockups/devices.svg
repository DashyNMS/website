    <text x="380" y="300" fill="#9aa4b6">10.0.6.14</text>
    <text x="520" y="300" fill="#9aa4b6">Ubiquiti</text>
    <text x="650" y="300" fill="#9aa4b6">12d 9h</text>
    <text x="790" y="300" fill="#9aa4b6">Lobby</text>

