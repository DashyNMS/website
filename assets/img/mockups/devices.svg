    <circle cx="150" cy="464" r="4.5" fill="#ef4444"/>
    <text x="180" y="468" font-weight="600" fill="#e8eef6">core-sw-02</text>
    <text x="380" y="468" fill="#9aa4b6">10.0.4.3</text>
    <text x="520" y="468" fill="#9aa4b6">Cisco IOS</text>
    <text x="650" y="468" fill="#ef4444">offline</text>
