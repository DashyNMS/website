    <rect x="88" y="396" width="16" height="16" rx="3" fill="none" stroke="#5b6472"/>
    <circle cx="150" cy="408" r="4.5" fill="#22c55e"/>
    <text x="180" y="412" font-weight="600" fill="#e8eef6">db-01</text>
    <text x="380" y="412" fill="#9aa4b6">10.0.2.9</text>
    <text x="520" y="412" fill="#9aa4b6">Linux</text>
    <text x="650" y="412" fill="#9aa4b6">501d 0h</text>
    <text x="790" y="412" fill="#9aa4b6">DC-2</text>

    <!-- row 6: down -->
    <rect x="88" y="430" width="868" height="56" fill="#ef4444" fill-opacity="0.07"/>
