<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="dev-title">
  <title id="dev-title">DashyNMS device grid with pinned devices, status, and columns for IP, OS, uptime and location</title>
  <style>
