<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 680" role="img" aria-labelledby="dash-title">
  <title id="dash-title">DashyNMS dashboard showing live alerts, an alerts gauge, device status counts, pinned sensors, a device graph, pinned devices and recently viewed devices</title>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- outer frame -->
  <rect x="0.5" y="0.5" width="1159" height="679" rx="14" fill="#171b23" stroke="#262c38"/>

  <!-- titlebar -->
  <path d="M0.5 14.5a14 14 0 0 1 14-14h1131a14 14 0 0 1 14 14v29.5H0.5V14.5z" fill="#171b23" stroke="#262c38"/>
  <rect x="20" y="14" width="16" height="16" rx="4" fill="#3b82f6"/>
  <text x="44" y="27" font-size="13" font-weight="600" fill="#9aa4b6">DashyNMS</text>
  <g stroke="#5b6472" stroke-width="1.4" stroke-linecap="round">
    <line x1="1076" y1="22" x2="1088" y2="22"/>
    <rect x="1112" y="16" width="12" height="12" rx="2" fill="none"/>
    <line x1="1148" y1="16" x2="1160" y2="28"/>
    <line x1="1160" y1="16" x2="1148" y2="28"/>
  </g>

  <!-- sidebar -->
  <rect x="0" y="44" width="64" height="636" fill="#10131a"/>
  <line x1="64" y1="44" x2="64" y2="680" stroke="#262c38"/>

  <!-- active highlight: Dashboard -->
  <rect x="8" y="48" width="48" height="48" rx="10" fill="#3b82f6" fill-opacity="0.16"/>

  <!-- sidebar icons -->
  <g fill="none" stroke="#c3cbd9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- dashboard grid (active, accent) -->
    <g transform="translate(20,60)" stroke="#3b82f6">
      <rect x="0" y="0" width="10" height="10" rx="2"/>
      <rect x="14" y="0" width="10" height="10" rx="2"/>
      <rect x="0" y="14" width="10" height="10" rx="2"/>
      <rect x="14" y="14" width="10" height="10" rx="2"/>
    </g>
    <!-- devices / server -->
    <g transform="translate(20,116)">
      <rect x="0" y="1" width="24" height="8" rx="2"/>
      <rect x="0" y="15" width="24" height="8" rx="2"/>
      <circle cx="5" cy="5" r="1.4" fill="#c3cbd9" stroke="none"/>
      <circle cx="5" cy="19" r="1.4" fill="#c3cbd9" stroke="none"/>
    </g>
    <!-- alerts / bell -->
    <g transform="translate(20,172)">
      <path d="M12 1c-3.3 0-6 2.7-6 6v3.5L4 15h16l-2-4.5V7c0-3.3-2.7-6-6-6z"/>
      <path d="M9.5 18a2.5 2.5 0 0 0 5 0"/>
    </g>
    <!-- rules / list -->
    <g transform="translate(20,228)">
      <line x1="0" y1="2" x2="24" y2="2"/>
      <line x1="0" y1="11" x2="24" y2="11"/>
      <line x1="0" y1="20" x2="16" y2="20"/>
    </g>
    <!-- groups / location pin -->
    <g transform="translate(20,284)">
      <path d="M12 1C7.8 1 4.5 4.3 4.5 8.4 4.5 13.8 12 22 12 22s7.5-8.2 7.5-13.6C19.5 4.3 16.2 1 12 1z"/>
      <circle cx="12" cy="8.3" r="2.6"/>
    </g>
    <!-- settings / gear -->
    <g transform="translate(20,632)">
      <circle cx="12" cy="12" r="3.4"/>
      <g stroke-width="1.6">
        <line x1="12" y1="1" x2="12" y2="4.6"/>
        <line x1="12" y1="19.4" x2="12" y2="23"/>
        <line x1="1" y1="12" x2="4.6" y2="12"/>
        <line x1="19.4" y1="12" x2="23" y2="12"/>
        <line x1="4.5" y1="4.5" x2="7" y2="7"/>
        <line x1="17" y1="17" x2="19.5" y2="19.5"/>
        <line x1="19.5" y1="4.5" x2="17" y2="7"/>
        <line x1="7" y1="17" x2="4.5" y2="19.5"/>
      </g>
    </g>
  </g>

  <!-- ===================== Row 1 ===================== -->

  <!-- Live alerts -->
  <g>
    <rect x="88" y="68" width="500" height="180" rx="10" fill="#1c212b" stroke="#262c38"/>
    <text x="104" y="92" font-size="11" font-weight="600" letter-spacing="1" fill="#9aa4b6">LIVE ALERTS</text>
    <text x="572" y="92" font-size="11" fill="#9aa4b6" text-anchor="end">4 open</text>

    <g font-size="12.3">
      <circle cx="104" cy="118" r="4" fill="#ef4444"/>
      <text x="118" y="122"><tspan font-weight="600" fill="#e8eef6">core-sw-02</tspan><tspan fill="#9aa4b6"> — High temperature, rack 3</tspan></text>
      <text x="572" y="122" text-anchor="end" font-size="11" fill="#9aa4b6">2m</text>

      <circle cx="104" cy="148" r="4" fill="#f59e0b"/>
      <text x="118" y="152"><tspan font-weight="600" fill="#e8eef6">edge-fw-01</tspan><tspan fill="#9aa4b6"> — Interface errors rising</tspan></text>
      <text x="572" y="152" text-anchor="end" font-size="11" fill="#9aa4b6">6m</text>

      <circle cx="104" cy="178" r="4" fill="#f59e0b"/>
      <text x="118" y="182"><tspan font-weight="600" fill="#e8eef6">ap-lobby-3</tspan><tspan fill="#9aa4b6"> — Signal below threshold</tspan></text>
      <text x="572" y="182" text-anchor="end" font-size="11" fill="#9aa4b6">14m</text>

      <circle cx="104" cy="208" r="4" fill="#22c55e"/>
      <text x="118" y="212"><tspan font-weight="600" fill="#e8eef6">dc-ups-1</tspan><tspan fill="#9aa4b6"> — Battery test completed</tspan></text>
      <text x="572" y="208" text-anchor="end" font-size="11" fill="#9aa4b6">41m</text>
    </g>
  </g>

  <!-- Alerts gauge -->
  <g>
    <rect x="602" y="68" width="220" height="180" rx="10" fill="#1c212b" stroke="#262c38"/>
    <text x="618" y="92" font-size="11" font-weight="600" letter-spacing="1" fill="#9aa4b6">ALERTS</text>

    <g transform="rotate(-90 682 158)">
      <circle cx="682" cy="158" r="46" fill="none" stroke="#f59e0b" stroke-width="12" stroke-dasharray="217 72.03" stroke-dashoffset="-72" stroke-linecap="round"/>
      <circle cx="682" cy="158" r="46" fill="none" stroke="#ef4444" stroke-width="12" stroke-dasharray="72 217.03" stroke-linecap="round"/>
    </g>
    <text x="682" y="153" text-anchor="middle" font-size="26" font-weight="700" fill="#e8eef6">12</text>
    <text x="682" y="171" text-anchor="middle" font-size="9.5" fill="#9aa4b6">open alerts</text>

    <g font-size="11.5">
      <circle cx="742" cy="205" r="4" fill="#ef4444"/>
      <text x="752" y="209" fill="#c3cbd9">Critical <tspan fill="#9aa4b6">3</tspan></text>
      <circle cx="742" cy="224" r="4" fill="#f59e0b"/>
      <text x="752" y="228" fill="#c3cbd9">Warning <tspan fill="#9aa4b6">9</tspan></text>
    </g>
  </g>

  <!-- Device status counts -->
  <g>
    <rect x="838" y="68" width="298" height="180" rx="10" fill="#1c212b" stroke="#262c38"/>
    <text x="854" y="92" font-size="11" font-weight="600" letter-spacing="1" fill="#9aa4b6">DEVICES</text>

    <!-- tile: total -->
    <g>
      <rect x="854" y="104" width="126" height="54" rx="8" fill="#171b23" stroke="#262c38"/>
      <rect x="854" y="104" width="3" height="54" rx="1.5" fill="#3b82f6"/>
      <text x="870" y="132" font-size="21" font-weight="700" fill="#e8eef6">150</text>
      <text x="870" y="148" font-size="10" fill="#9aa4b6">Total devices</text>
    </g>
    <!-- tile: up -->
    <g>
      <rect x="994" y="104" width="126" height="54" rx="8" fill="#171b23" stroke="#262c38"/>
      <rect x="994" y="104" width="3" height="54" rx="1.5" fill="#22c55e"/>
      <text x="1010" y="132" font-size="21" font-weight="700" fill="#22c55e">142</text>
      <text x="1010" y="148" font-size="10" fill="#9aa4b6">Up</text>
    </g>
    <!-- tile: down -->
    <g>
      <rect x="854" y="172" width="126" height="54" rx="8" fill="#171b23" stroke="#262c38"/>
      <rect x="854" y="172" width="3" height="54" rx="1.5" fill="#ef4444"/>
      <text x="870" y="200" font-size="21" font-weight="700" fill="#ef4444">3</text>
      <text x="870" y="216" font-size="10" fill="#9aa4b6">Down</text>
    </g>
    <!-- tile: warning -->
    <g>
      <rect x="994" y="172" width="126" height="54" rx="8" fill="#171b23" stroke="#262c38"/>
      <rect x="994" y="172" width="3" height="54" rx="1.5" fill="#f59e0b"/>
      <text x="1010" y="200" font-size="21" font-weight="700" fill="#f59e0b">5</text>
      <text x="1010" y="216" font-size="10" fill="#9aa4b6">Warning</text>
    </g>
  </g>

  <!-- ===================== Row 2 ===================== -->

  <!-- Pinned sensors -->
  <g font-size="12">
    <rect x="88" y="262" width="330" height="180" rx="10" fill="#1c212b" stroke="#262c38"/>
    <text x="104" y="286" font-size="11" font-weight="600" letter-spacing="1" fill="#9aa4b6">PINNED SENSORS</text>

    <text x="104" y="314" fill="#c3cbd9">core-sw-01 · Temp</text>
    <text x="402" y="314" text-anchor="end" font-weight="600" fill="#22c55e">42&#176;C</text>
    <rect x="104" y="322" width="298" height="6" rx="3" fill="#262c38"/>
    <rect x="104" y="322" width="164" height="6" rx="3" fill="#22c55e"/>

    <text x="104" y="352" fill="#c3cbd9">ap-lobby-3 · Signal</text>
    <text x="402" y="352" text-anchor="end" font-weight="600" fill="#f59e0b">-79dBm</text>
    <rect x="104" y="360" width="298" height="6" rx="3" fill="#262c38"/>
    <rect x="104" y="360" width="224" height="6" rx="3" fill="#f59e0b"/>

    <text x="104" y="390" fill="#c3cbd9">edge-fw-01 · Fan</text>
    <text x="402" y="390" text-anchor="end" font-weight="600" fill="#22c55e">3200rpm</text>
    <rect x="104" y="398" width="298" height="6" rx="3" fill="#262c38"/>
    <rect x="104" y="398" width="120" height="6" rx="3" fill="#22c55e"/>
  </g>

  <!-- Device graph -->
  <g>
    <rect x="434" y="262" width="380" height="180" rx="10" fill="#1c212b" stroke="#262c38"/>
    <text x="450" y="286" font-size="11" font-weight="600" letter-spacing="1" fill="#9aa4b6">DEVICE GRAPH</text>
    <text x="798" y="286" font-size="11" fill="#9aa4b6" text-anchor="end">edge-fw-01 · CPU</text>

    <g stroke="#262c38" stroke-dasharray="2 3">
      <line x1="450" y1="310" x2="800" y2="310"/>
      <line x1="450" y1="345" x2="800" y2="345"/>
      <line x1="450" y1="380" x2="800" y2="380"/>
    </g>

    <polygon points="450,395 480,380 510,388 540,355 570,365 600,335 630,345 660,315 690,325 720,300 750,312 800,305 800,410 450,410"
             fill="#3b82f6" fill-opacity="0.14"/>
    <polyline points="450,395 480,380 510,388 540,355 570,365 600,335 630,345 660,315 690,325 720,300 750,312 800,305"
              fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g font-size="9.5" fill="#9aa4b6">
      <text x="450" y="424">-1h</text>
      <text x="625" y="424" text-anchor="middle">-30m</text>
      <text x="800" y="424" text-anchor="end">now</text>
    </g>
  </g>

  <!-- Pinned devices -->
  <g font-size="12.3">
    <rect x="830" y="262" width="306" height="180" rx="10" fill="#1c212b" stroke="#262c38"/>
    <text x="846" y="286" font-size="11" font-weight="600" letter-spacing="1" fill="#9aa4b6">PINNED DEVICES</text>

    <circle cx="846" cy="316" r="4" fill="#22c55e"/>
    <text x="860" y="320" font-weight="600" fill="#e8eef6">core-sw-01</text>
    <text x="1120" y="320" text-anchor="end" font-size="11" fill="#9aa4b6">10.0.4.2</text>

    <circle cx="846" cy="352" r="4" fill="#f59e0b"/>
    <text x="860" y="356" font-weight="600" fill="#e8eef6">edge-fw-01</text>
    <text x="1120" y="356" text-anchor="end" font-size="11" fill="#9aa4b6">10.0.1.1</text>

    <circle cx="846" cy="388" r="4" fill="#22c55e"/>
    <text x="860" y="392" font-weight="600" fill="#e8eef6">dc-ups-1</text>
    <text x="1120" y="392" text-anchor="end" font-size="11" fill="#9aa4b6">10.0.9.5</text>
  </g>

  <!-- ===================== Row 3 ===================== -->

  <g>
    <rect x="88" y="456" width="1048" height="144" rx="10" fill="#1c212b" stroke="#262c38"/>
    <text x="104" y="480" font-size="11" font-weight="600" letter-spacing="1" fill="#9aa4b6">RECENTLY VIEWED</text>

    <g font-size="12">
      <!-- chip template repeated -->
      <g transform="translate(104,498)">
        <rect width="190" height="76" rx="8" fill="#171b23" stroke="#262c38"/>
        <circle cx="16" cy="18" r="4" fill="#22c55e"/>
        <text x="28" y="22" font-weight="600" fill="#e8eef6">core-sw-01</text>
        <text x="16" y="42" font-size="10.5" fill="#9aa4b6">Cisco IOS · switch</text>
        <text x="16" y="62" font-size="10" fill="#5b6472">viewed 3m ago</text>
      </g>
      <g transform="translate(310,498)">
        <rect width="190" height="76" rx="8" fill="#171b23" stroke="#262c38"/>
        <circle cx="16" cy="18" r="4" fill="#f59e0b"/>
        <text x="28" y="22" font-weight="600" fill="#e8eef6">ap-lobby-3</text>
        <text x="16" y="42" font-size="10.5" fill="#9aa4b6">Ubiquiti · wireless</text>
        <text x="16" y="62" font-size="10" fill="#5b6472">viewed 9m ago</text>
      </g>
      <g transform="translate(516,498)">
        <rect width="190" height="76" rx="8" fill="#171b23" stroke="#262c38"/>
        <circle cx="16" cy="18" r="4" fill="#22c55e"/>
        <text x="28" y="22" font-weight="600" fill="#e8eef6">dc-ups-1</text>
        <text x="16" y="42" font-size="10.5" fill="#9aa4b6">APC · power</text>
        <text x="16" y="62" font-size="10" fill="#5b6472">viewed 22m ago</text>
      </g>
      <g transform="translate(722,498)">
        <rect width="190" height="76" rx="8" fill="#171b23" stroke="#262c38"/>
        <circle cx="16" cy="18" r="4" fill="#f59e0b"/>
        <text x="28" y="22" font-weight="600" fill="#e8eef6">edge-fw-01</text>
        <text x="16" y="42" font-size="10.5" fill="#9aa4b6">pfSense · firewall</text>
        <text x="16" y="62" font-size="10" fill="#5b6472">viewed 26m ago</text>
      </g>
      <g transform="translate(928,498)">
        <rect width="190" height="76" rx="8" fill="#171b23" stroke="#262c38"/>
        <circle cx="16" cy="18" r="4" fill="#22c55e"/>
        <text x="28" y="22" font-weight="600" fill="#e8eef6">db-01</text>
        <text x="16" y="42" font-size="10.5" fill="#9aa4b6">Linux · server</text>
        <text x="16" y="62" font-size="10" fill="#5b6472">viewed 1h ago</text>
      </g>
    </g>
  </g>
</svg>
