<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="alerts-title">
  <title id="alerts-title">DashyNMS alerts list filtered by severity, with acknowledge actions and CSV export</title>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <rect x="0.5" y="0.5" width="979" height="619" rx="14" fill="#171b23" stroke="#262c38"/>

  <path d="M0.5 14.5a14 14 0 0 1 14-14h951a14 14 0 0 1 14 14v29.5H0.5V14.5z" fill="#171b23" stroke="#262c38"/>
  <rect x="20" y="14" width="16" height="16" rx="4" fill="#3b82f6"/>
  <text x="44" y="27" font-size="13" font-weight="600" fill="#9aa4b6">DashyNMS</text>
  <g stroke="#5b6472" stroke-width="1.4" stroke-linecap="round">
    <line x1="896" y1="22" x2="908" y2="22"/>
    <rect x="932" y="16" width="12" height="12" rx="2" fill="none"/>
    <line x1="968" y1="16" x2="980" y2="28"/>
    <line x1="980" y1="16" x2="968" y2="28"/>
  </g>

  <rect x="0" y="44" width="64" height="576" fill="#10131a"/>
  <line x1="64" y1="44" x2="64" y2="620" stroke="#262c38"/>
  <rect x="8" y="160" width="48" height="48" rx="10" fill="#3b82f6" fill-opacity="0.16"/>

  <g fill="none" stroke="#c3cbd9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(20,60)">
      <rect x="0" y="0" width="10" height="10" rx="2"/>
      <rect x="14" y="0" width="10" height="10" rx="2"/>
      <rect x="0" y="14" width="10" height="10" rx="2"/>
      <rect x="14" y="14" width="10" height="10" rx="2"/>
    </g>
    <g transform="translate(20,116)">
      <rect x="0" y="1" width="24" height="8" rx="2"/>
      <rect x="0" y="15" width="24" height="8" rx="2"/>
      <circle cx="5" cy="5" r="1.4" fill="#c3cbd9" stroke="none"/>
      <circle cx="5" cy="19" r="1.4" fill="#c3cbd9" stroke="none"/>
    </g>
    <g transform="translate(20,172)" stroke="#3b82f6">
      <path d="M12 1c-3.3 0-6 2.7-6 6v3.5L4 15h16l-2-4.5V7c0-3.3-2.7-6-6-6z"/>
      <path d="M9.5 18a2.5 2.5 0 0 0 5 0"/>
    </g>
    <g transform="translate(20,228)">
      <line x1="0" y1="2" x2="24" y2="2"/>
      <line x1="0" y1="11" x2="24" y2="11"/>
      <line x1="0" y1="20" x2="16" y2="20"/>
    </g>
    <g transform="translate(20,284)">
      <path d="M12 1C7.8 1 4.5 4.3 4.5 8.4 4.5 13.8 12 22 12 22s7.5-8.2 7.5-13.6C19.5 4.3 16.2 1 12 1z"/>
      <circle cx="12" cy="8.3" r="2.6"/>
    </g>
    <g transform="translate(20,572)">
      <circle cx="12" cy="12" r="3.4"/>
      <g stroke-width="1.6">
        <line x1="12" y1="1" x2="12" y2="4.6"/>
        <line x1="12" y1="19.4" x2="12" y2="23"/>
        <line x1="1" y1="12" x2="4.6" y2="12"/>
        <line x1="19.4" y1="12" x2="23" y2="12"/>
        <line x1="4.5" y1="4.5" x2="7" y2="7"/>
        <line x1="17" y1="17" x2="19.5" y2="19.5"/>
        <line x1="19.5" y1="4.5" x2="17" y2="7"/>
        <line x1="7" y1="17" x2="4.5" y2="19.5"/>
      </g>
    </g>
  </g>

  <!-- filter chips -->
  <g font-size="12">
    <rect x="88" y="68" width="80" height="36" rx="18" fill="#3b82f6"/>
    <text x="128" y="91" fill="#ffffff" text-anchor="middle" font-weight="600">All 24</text>

    <rect x="176" y="68" width="104" height="36" rx="18" fill="none" stroke="#262c38"/>
    <circle cx="196" cy="86" r="4" fill="#ef4444"/>
    <text x="208" y="91" fill="#c3cbd9">Critical 3</text>

    <rect x="288" y="68" width="104" height="36" rx="18" fill="none" stroke="#262c38"/>
    <circle cx="308" cy="86" r="4" fill="#f59e0b"/>
    <text x="320" y="91" fill="#c3cbd9">Warning 9</text>

    <rect x="400" y="68" width="150" height="36" rx="18" fill="none" stroke="#262c38"/>
    <circle cx="420" cy="86" r="4" fill="#5b6472"/>
    <text x="432" y="91" fill="#c3cbd9">Acknowledged 12</text>
  </g>

  <rect x="574" y="68" width="170" height="36" rx="8" fill="#1c212b" stroke="#262c38"/>
  <circle cx="592" cy="86" r="6" fill="none" stroke="#9aa4b6" stroke-width="1.5"/>
  <line x1="596.5" y1="90.5" x2="602" y2="96" stroke="#9aa4b6" stroke-width="1.5" stroke-linecap="round"/>
  <text x="610" y="91" font-size="12" fill="#9aa4b6">Search alerts…</text>

  <rect x="760" y="68" width="132" height="36" rx="8" fill="none" stroke="#262c38"/>
  <text x="826" y="91" font-size="12.5" font-weight="600" fill="#c3cbd9" text-anchor="middle">Export CSV</text>

  <!-- table header -->
  <g font-size="10.5" font-weight="600" letter-spacing="0.5" fill="#9aa4b6">
    <text x="140" y="138">HOST</text>
    <text x="340" y="138">RULE</text>
    <text x="600" y="138">NOTE</text>
    <text x="840" y="138">TIME</text>
  </g>
  <line x1="88" y1="150" x2="956" y2="150" stroke="#262c38"/>

  <g font-size="12.3">

    <!-- row 1 -->
    <rect x="88" y="150" width="868" height="56" fill="#ef4444" fill-opacity="0.06"/>
    <circle cx="104" cy="184" r="4.5" fill="#ef4444"/>
    <text x="140" y="180" font-weight="600" fill="#e8eef6">core-sw-02</text>
    <text x="340" y="180" fill="#c3cbd9">Temperature &gt; 75&#176;C</text>
    <text x="600" y="180" fill="#9aa4b6">Rack 3 sensor</text>
    <text x="840" y="180" fill="#9aa4b6">2m</text>
    <rect x="140" y="188" width="112" height="26" rx="13" fill="#3b82f6"/>
    <text x="196" y="205" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Acknowledge</text>

    <!-- row 2 -->
    <rect x="88" y="206" width="868" height="56" fill="#1c212b" fill-opacity="0.4"/>
    <circle cx="104" cy="240" r="4.5" fill="#f59e0b"/>
    <text x="140" y="236" font-weight="600" fill="#e8eef6">edge-fw-01</text>
    <text x="340" y="236" fill="#c3cbd9">Interface errors/min &gt; 50</text>
    <text x="600" y="236" fill="#9aa4b6">Increasing trend</text>
    <text x="840" y="236" fill="#9aa4b6">6m</text>
    <rect x="140" y="244" width="112" height="26" rx="13" fill="none" stroke="#3b82f6"/>
    <text x="196" y="261" font-size="11" font-weight="600" fill="#3b82f6" text-anchor="middle">Acknowledge</text>

    <!-- row 3 -->
    <rect x="88" y="262" width="868" height="56" fill="#1c212b" fill-opacity="0.4"/>
    <circle cx="104" cy="296" r="4.5" fill="#f59e0b"/>
    <text x="140" y="292" font-weight="600" fill="#e8eef6">ap-lobby-3</text>
    <text x="340" y="292" fill="#c3cbd9">Signal &lt; -75dBm</text>
    <text x="600" y="292" fill="#9aa4b6">&#8212;</text>
    <text x="840" y="292" fill="#9aa4b6">14m</text>
    <rect x="140" y="300" width="112" height="26" rx="13" fill="none" stroke="#3b82f6"/>
    <text x="196" y="317" font-size="11" font-weight="600" fill="#3b82f6" text-anchor="middle">Acknowledge</text>

    <!-- row 4: acknowledged -->
    <rect x="88" y="318" width="868" height="56" fill="#1c212b" fill-opacity="0.4"/>
    <circle cx="104" cy="352" r="4.5" fill="#5b6472"/>
    <text x="140" y="348" font-weight="600" fill="#e8eef6">dc-ups-1</text>
    <text x="340" y="348" fill="#c3cbd9">Battery self-test</text>
    <text x="600" y="348" fill="#9aa4b6">Completed OK</text>
    <text x="840" y="348" fill="#9aa4b6">41m</text>
    <text x="140" y="368" font-size="11" fill="#5b6472">&#10003; Acknowledged by tpickup</text>

    <!-- row 5 -->
    <rect x="88" y="374" width="868" height="56" fill="#ef4444" fill-opacity="0.06"/>
    <circle cx="104" cy="408" r="4.5" fill="#ef4444"/>
    <text x="140" y="404" font-weight="600" fill="#e8eef6">core-sw-04</text>
    <text x="340" y="404" fill="#c3cbd9">Interface down</text>
    <text x="600" y="404" fill="#9aa4b6">Gi0/3 admin down</text>
    <text x="840" y="404" fill="#9aa4b6">1h</text>
    <rect x="140" y="412" width="112" height="26" rx="13" fill="#3b82f6"/>
    <text x="196" y="429" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Acknowledge</text>

    <!-- row 6: acknowledged -->
    <rect x="88" y="430" width="868" height="56" fill="#1c212b" fill-opacity="0.4"/>
    <circle cx="104" cy="464" r="4.5" fill="#5b6472"/>
    <text x="140" y="460" font-weight="600" fill="#e8eef6">db-01</text>
    <text x="340" y="460" fill="#c3cbd9">Disk usage &gt; 90%</text>
    <text x="600" y="460" fill="#9aa4b6">/var partition</text>
    <text x="840" y="460" fill="#9aa4b6">3h</text>
    <text x="140" y="480" font-size="11" fill="#5b6472">&#10003; Acknowledged by tpickup</text>
  </g>
</svg>
