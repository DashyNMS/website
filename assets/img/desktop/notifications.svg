<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="notif-title">
  <title id="notif-title">A Windows toast notification for a critical DashyNMS alert, and the tray icon showing an open-alert badge</title>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10131a"/>
      <stop offset="1" stop-color="#161a24"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="979" height="619" rx="14" fill="url(#desk)" stroke="#262c38"/>

  <!-- faint stacked toast behind -->
  <rect x="586" y="366" width="340" height="132" rx="12" fill="#171b23" fill-opacity="0.5" stroke="#262c38"/>

  <!-- main toast -->
  <g>
    <rect x="596" y="380" width="340" height="132" rx="12" fill="#1c212b" stroke="#262c38"/>
    <rect x="596" y="380" width="4" height="132" fill="#ef4444"/>

    <rect x="618" y="400" width="14" height="14" rx="4" fill="#3b82f6"/>
    <text x="640" y="411" font-size="11" font-weight="600" letter-spacing="0.4" fill="#9aa4b6">DASHYNMS</text>
    <text x="912" y="411" font-size="11" fill="#5b6472" text-anchor="end">now</text>

    <text x="618" y="436" font-size="15" font-weight="700" fill="#e8eef6">3 new critical alerts</text>
    <text x="618" y="458" font-size="12.5" fill="#c3cbd9">core-sw-02 — High temperature</text>
    <text x="618" y="476" font-size="12.5" fill="#9aa4b6">+2 more in Rack 3</text>

    <text x="618" y="500" font-size="11" fill="#5b6472" font-style="italic">Repeating sound · stays until dismissed</text>
    <g stroke="#5b6472" stroke-width="1.4" stroke-linecap="round">
      <line x1="908" y1="394" x2="918" y2="404"/>
      <line x1="918" y1="394" x2="908" y2="404"/>
    </g>
  </g>

  <!-- taskbar -->
  <rect x="0" y="566" width="980" height="54" fill="#171b23"/>
  <line x1="0" y1="566" x2="980" y2="566" stroke="#262c38"/>

  <g stroke="#7c8698" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- wifi -->
    <g transform="translate(770,582)">
      <path d="M0 10c5-6 15-6 20 0"/>
      <path d="M4 14c3.5-4 8.5-4 12 0"/>
      <circle cx="10" cy="18" r="1.3" fill="#7c8698" stroke="none"/>
    </g>
    <!-- volume -->
    <g transform="translate(806,584)">
      <path d="M0 8h4l6-5v14l-6-5H0z" fill="#7c8698" stroke="none"/>
      <path d="M13 6c2.5 2.5 2.5 7.5 0 10"/>
    </g>
    <!-- battery -->
    <g transform="translate(840,586)">
      <rect x="0" y="0" width="20" height="10" rx="2"/>
      <rect x="21" y="3" width="2.5" height="4" fill="#7c8698" stroke="none"/>
      <rect x="2" y="2" width="14" height="6" fill="#7c8698" stroke="none"/>
    </g>
  </g>

  <!-- DashyNMS tray icon with badge -->
  <g transform="translate(884,584)">
    <circle cx="11" cy="11" r="11" fill="#10131a" stroke="#3b82f6" stroke-width="1.6"/>
    <polyline points="4,12 8,12 10.5,7 13.5,16 16,10 18,10" fill="none" stroke="#e8eef6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="19" cy="3" r="7" fill="#ef4444"/>
    <text x="19" y="6" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  </g>

  <text x="956" y="600" font-size="12" fill="#9aa4b6" text-anchor="end">14:32</text>
  <text x="956" y="614" font-size="10" fill="#5b6472" text-anchor="end">26/09/2026</text>
</svg>
